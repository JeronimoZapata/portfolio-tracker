services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "5432:5432"
    volumes:
      - portfolio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: portfolio-tracker-app:local
    build:
      context: .
      target: development
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://portfolio:portfolio@postgres:5432/portfolio
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - portfolio_app_node_modules:/app/node_modules
      - portfolio_app_next:/app/.next
      - portfolio_pnpm_store:/pnpm/store
    command: ["sh", "-c", "pnpm db:migrate && pnpm dev"]

  postgres-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  test:
    profiles: ["test"]
    image: portfolio-tracker-app:local
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://portfolio:portfolio@postgres-test:5432/portfolio_test
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - portfolio_pnpm_store:/pnpm/store
    stdin_open: true
    tty: true
    command:
      [
        "sh",
        "-c",
        "pnpm db:migrate && pnpm format:check && pnpm lint && pnpm typecheck && pnpm test:ci && pnpm build",
      ]

volumes:
  portfolio_postgres_data:
  portfolio_app_node_modules:
  portfolio_app_next:
  portfolio_pnpm_store:
